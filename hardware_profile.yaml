# Target machine, budget, and environment facts.
#
# Missing keys fall back to defaults in praxis/config.py::load_facts. Every
# value here is rendered into design passes as a hard constraint, so keep it
# accurate; label anything you have not verified.
#
# Precedence: env > this file > live host detection > defaults, EXCEPT the
# volatile readings (storage_free_gb, usable_ram_gb) where a live probe
# overrides this file's snapshot, which goes stale.
os: Windows 11 + WSL2
# Probed Sep 2026: "Intel64 Family 6 Model 154 Stepping 4, GenuineIntel",
# 12 logical cores.
cpu: Intel Core (HP 15s laptop)
cpu_cores: 12
cpu_only: true
gpu: null
gpu_name: Intel Iris Xe Graphics
gpu_note: "Intel Iris Xe integrated graphics, ~4 GB shared memory - not CUDA-capable; CPU-only execution"
ram_gb: 8
# RAM is shared with the OS: the app should plan for this much usable headroom.
usable_ram_gb: 4
ram_note: "8 GB total / 7.68 GB reported / about 4 GB app headroom (shared with Windows)"
# Snapshot of free space on the working volume (Sep 2026); a live probe
# overrides this value, so treat it as a fallback only.
storage_free_gb: 46
monthly_budget_usd: 15.0
# Runs locally; a VPS is out unless the design explicitly justifies one.
local_only: true
preferred_stack:
  - Python
  - LangGraph
  - SQLite
  - Groq API
stack_notes:
  - "Local generative models: Ollama serving a 2B-class model (e.g. llama3.2:3b), llama.cpp with GGUF quantized weights (CPU), sized to the usable-RAM headroom"
  - "Runtime: Python 3.13 on Windows"
  - "Embeddings: use a small dedicated embedding model (e.g. a compact sentence-transformer), not the generative LLM"
  - "Persistence: prefer SQLite unless the design proves it insufficient"
  - "Avoid CUDA-only libraries entirely — the machine is CPU-only"
  - "Docker / WSL2 only if the design explicitly justifies it; otherwise plain Python on Windows"
  - "If local 2B quality is insufficient, an OPTIONAL hosted 70B-class fallback exists (see provider_limits): a rate-limited free endpoint; the design must remain fully functional without it"
avoid:
  - Docker-heavy pipelines
  - local GPU-required models
  - Neo4j
  - CUDA-only libraries
  - VPS unless justified
provider_limits:
  - "openrouter: VERIFIED Oct 10, 2026 - nvidia/nemotron-3.5-lightning:free answers 1-token probes; free tier is 50 requests/day (counted only on success)"
  - "cerebras: billing dead (payment required, Sep 29, 2026) - key kept but removed from the design chain; do not rely on it"
  - "nvidia_nim: design-chain LEAD (litellm id nvidia_nim/nvidia/nemotron-3-super-120b-a12b, needs NVIDIA_NIM_API_KEY) - rate-limited free endpoint; designs must degrade gracefully to the groq/openrouter entries when it is unavailable"
# Chain health (re-probed Oct 10, 2026): the effective design/plan chain is
# nvidia_nim -> groq/openai/gpt-oss-120b -> openrouter/nvidia/nemotron-3.5-
# lightning:free. Replaced entries: openrouter/openai/gpt-oss-120b:free (dead,
# 404 "unavailable for free"), groq/qwen/qwen3.8-27b (otpm=1000 could not
# serve the 2000-token design/plan budgets - see its entry below),
# cerebras/qwen-3.8-27b (payment required). OpenRouter free candidates ruled
# out: thinkingmachines/inkling{,-small}:free 403 "agentic harnesses only",
# nvidia/nemotron-3-ultra-550b-a55b:free timed out twice at 30s. Re-probe
# (praxis doctor --deep) before relying on any entry.
# Per-model free-tier rate limits (tpm/itpm/otpm are PER-MINUTE pacing
# budgets); each limit is optional and a model with no entry here (or a
# missing limit) is NOT throttled by the design engine. Optional max_output
# is a per-request output ceiling (unverified until set); when absent, otpm
# doubles as the ceiling and the truncation retry never exceeds it.
model_limits:
  - model: groq/openai/gpt-oss-120b
    tpm: 8000
    note: "observed on the free tier, Sep 2026, may change"
  - model: groq/openai/gpt-oss-20b
    tpm: 8000
    note: "observed on the free tier, Sep 2026, may change"
  # KNOWN LIMITATION (flagged Sep 29, 2026, mitigated Oct 10, 2026 by moving
  # this model out of PRAXIS_DESIGN_MODEL): otpm=1000 doubles as this model's
  # per-request output ceiling, while design/plan pass budgets (1200-2000
  # tokens) are resolved against the chain LEAD. A failover here truncates
  # and fails fast: min(2x retry, ceiling=1000) can never exceed the failed
  # attempt, so the entry burns one call and skips ahead. Still applies to
  # ANY otpm-limited model put in the chain. Fix if reintroduced: re-clamp
  # pass budgets per chain entry, or raise otpm/max_output.
  - model: groq/qwen/qwen3.8-27b
    itpm: 7000
    otpm: 1000
    note: "observed on the free tier, Sep 2026; NOT in PRAXIS_DESIGN_MODEL since Oct 10, 2026"
  - model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
    max_output: 4096
    note: "observed Sep 2026: pack pass env_example truncated twice at 1200 output tokens; 4096 covers current pass budgets - pacing (tpm/otpm) not yet observed"
  # Third chain entry (verified Oct 10, 2026). max_output observed from the
  # OpenRouter models endpoint (top_provider.max_completion_tokens=65536);
  # a max_tokens=65537 request was ACCEPTED, so the router enforces the 1M
  # context window rather than the 65536 figure - use it as a conservative
  # per-request ceiling, not a hard wire limit. tpm/itpm/otpm deliberately
  # unset: they are not observable from the API, and a model with no entry is
  # not paced by the design engine. Free tier is 50 REQUESTS/day (only
  # successes count), so this entry is failover insurance, not a workhorse.
  - model: openrouter/nvidia/nemotron-3.5-lightning:free
    max_output: 65536
    note: "observed Oct 10, 2026; default reasoning is ON (222 of 239 completion tokens on a trivial ping), so effective content output per pass is lower than max_output"
